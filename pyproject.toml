[project]
name = "anomalylab"
version = "0.1.0"
description = "Production-Grade Anomaly Detection & ML Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mlflow>=2.19.0",
    "numpy>=2.0.0",
    "optuna>=4.1.0",
    "polars>=1.20.0",
    "prometheus-client>=0.21.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.0",
    "scipy>=1.14.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anomalylab", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".agents", ".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
