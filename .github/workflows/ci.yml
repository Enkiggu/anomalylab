name: AnomalyLab CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest suite
        run: uv run pytest tests/ -v --durations=10

      - name: Test deterministic data pipeline
        run: |
          uv run python -m anomalylab.data.generate --config configs/data_security.yaml
          uv run python -m anomalylab.data.validator --input data/raw/security_events_v2.parquet
          uv run python -m anomalylab.features.pipeline --config configs/features_v1.yaml
          uv run python -m anomalylab.training.train --config configs/isolation_forest_security.yaml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Frontend build
        working-directory: apps/web
        run: npm run build
