services:
  postgres:
    image: postgres:16-alpine
    container_name: anomalylab-postgres
    environment:
      POSTGRES_DB: anomalylab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anomalylab"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: anomalylab-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_STORE_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/anomalylab
      ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/anomalylab
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: anomalylab-api
    depends_on:
      - postgres
      - mlflow
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/anomalylab
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./experiments:/app/experiments

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: anomalylab-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: anomalylab-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  mlflow_data:
